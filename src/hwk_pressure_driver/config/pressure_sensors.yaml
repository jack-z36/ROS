pressure_driver_node:
  ros__parameters:
    frame_id_prefix: pressure_sensor
    default_baudrate: 460800
    default_poll_rate_hz: 100.0
    serial_timeout: 0.01
    timeout_warn_sec: 1.0
    identity_map_file: /home/hit/ROS/config/hardware_identity_map.yaml
    strict_identity: true
    identity_query_timeout: 1.0
    identity_query_package_id: 29

    # The topic is selected by HWK_CHIP_UID in hardware_identity_map.yaml.
    # Serial paths are only candidate buses to open.
    sensor_defaults:
      device_addr: 6
      rows: 6
      cols: 15
    identity_scan_addrs: [5, 6]

    serial_port_globs:
      - /dev/ttyUSB*
      - /dev/ttyACM*
