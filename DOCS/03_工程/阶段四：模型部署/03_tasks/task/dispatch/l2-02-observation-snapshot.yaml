## 调度说明

### Wave 结构与依赖

```text
wave1 (types 层, 1 个 L3, 无依赖):
  deploy_011  types/observation.py  ObservationState / ObservationSnapshot / ObservationFreshnessResult

wave2 (service 层, 2 个 L3 并行, 依赖 types):
  deploy_012  service/observation_collector.py   ─┐
  deploy_013  service/image_preprocess.py         ─┘ 可并行 (不同文件)

wave3 (runtime 层, 1 个 L3, 依赖 types):
  deploy_014  runtime/observation_buffer.py  ObservationBuffer / ObservationMetrics

wave4 (ui 层, 1 个 L3, 依赖 types + service + runtime):
  deploy_015  ui/observation_ros_adapter.py  ObservationRosAdapter

wave5 (集成测试, 1 个 L3, 依赖全部):
  deploy_016  tests/integration/test_l2_02_gate.py + scripts/l2_02_verify.sh
```

### 冲突说明

- 所有 L3 的 `conflict_scope.files` 互不重叠，无同文件冲突。
- deploy_012 和 deploy_013 写不同的 service 文件，wave2 内可并行。
- deploy_015 依赖 deploy_012（collector）和 deploy_014（buffer），必须在 wave4 串行执行。
- `max_parallel_agents: 2`：wave2 有 2 个可并行 L3，恰好占满并行槽。

### L2 Gate 场景覆盖矩阵

| 场景 | 描述 | 主要覆盖 L3 | 辅助覆盖 L3 |
|---|---|---|---|
| S1 | Mock 全字段 snapshot 组装 | deploy_011, deploy_012, deploy_014, deploy_016 | deploy_013, deploy_015 |
| S2 | 缺字段 / 过期拒绝 | deploy_012, deploy_014, deploy_016 | deploy_011 |
| S3 | 图像预处理 | deploy_013, deploy_016 | — |
| S4 | Latest-only buffer 语义 | deploy_014, deploy_016 | — |
| S5 | 无 ROS 环境可 import | deploy_015, deploy_016 | deploy_011, deploy_012, deploy_014 |
| S6 | 边界不越界 | deploy_016 | — |

### 归档规则

当某个 L3 验收卡片返回 `PASS_LOCAL` 后，主 Agent 必须把对应任务文件从 `03_tasks/task/active/l2-02-observation-snapshot/` 移动到 `03_tasks/completed/l2-02-observation-snapshot/`。验收 Agent 不得执行归档。
