batch:
  input_dir: /home/hit/ROS/mcap
  output_dir: /home/hit/ROS/mcap_cleaned
  file_glob: "*.mcap"
  workers: 1
  overwrite: true
  fail_fast: true

transform:
  start_from_common:
    translation:
      x: 0.0
      y: 0.0
      z: 0.0
    rotation_xyzw:
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 1.0

pose_streams:
  - input_topic: /baton_mini_left/fast_odom
    msg_type: nav_msgs/msg/Odometry
    output_topic: /baton_mini_left/camera_common_pose
    transform_file: /home/hit/ROS/config/data_clean/data_clean_left_transform.yaml
  - input_topic: /baton_mini_right/fast_odom
    msg_type: nav_msgs/msg/Odometry
    output_topic: /baton_mini_right/camera_common_pose
    transform_file: /home/hit/ROS/config/data_clean/data_clean_right_transform.yaml

gripper_streams:
  - image_topic: /gopro_left/image_raw
    image_msg_type: sensor_msgs/msg/Image
    output_topic: /gopro_left/gripper_width
    output_msg_type: std_msgs/msg/Float32
    aruco_dict: DICT_4X4_50
    marker_id_0: 0
    marker_id_1: 1
    marker_min: 20.0
    marker_max: 300.0
    gripper_max: 100.0
  - image_topic: /gopro_right/image_raw
    image_msg_type: sensor_msgs/msg/Image
    output_topic: /gopro_right/gripper_width
    output_msg_type: std_msgs/msg/Float32
    aruco_dict: DICT_4X4_50
    marker_id_0: 0
    marker_id_1: 1
    marker_min: 20.0
    marker_max: 300.0
    gripper_max: 100.0
