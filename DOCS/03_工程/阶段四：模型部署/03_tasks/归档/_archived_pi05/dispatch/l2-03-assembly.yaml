## 调度说明

| wave | 任务 | 并行性 | 说明 |
|---|---|---|---|
| 1 | deploy_009 ∥ deploy_011 | 可并行 | 改不同文件（collector.py vs policy_loader.py），conflict_scope 无交集。都依赖 L2-01(deploy_002) + deploy_005(collector 还需 topic 字段)。 |
| 2 | deploy_010 | 单独 | 改 deploy_node 订阅侧，依赖 deploy_009（callback 调 collector 新方法）。与 L2-04 共享 deploy_node.py（发布侧），需协调。 |
| 3 | deploy_012 | 单独 | dry-run 验证，依赖前三者。 |

## 跨 L2 依赖说明

本功能组依赖 L2-01（deploy_002 state_codec）和 L2-02（deploy_005 observation topic）。`depends_on_external` 标注外部依赖。主 Agent 调度时须确认 deploy_002/005 已归档。

## 与 L2-04 的协调（关键）

deploy_010（本组）改 deploy_node.py 订阅侧，L2-04 改 deploy_node.py 发布侧。同一文件两半：
- **必须串行**（deploy_010 先，L2-04 后），或主 Agent 安排同一 Agent 顺序完成两半。
- 若并行，conflict_scope.files 有交集（pi05_vla_deploy_node.py），违反调度规则第 4 条。

## 全组完成标志

deploy_012 pytest 通过 = L2-03 数据装配层完成 = 可开始 L2-04（action 发布与 policy 安全）。

## 真机风险

deploy_012 为 dry-run-only（用构造数据 + stub，不接真机/真模型）。其余 L3 为 none。真机风险在 L2-05。
