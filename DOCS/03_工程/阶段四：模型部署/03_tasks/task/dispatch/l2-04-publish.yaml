|---|---|---|---|
| 1 | deploy_013 ∥ deploy_014 | 可并行 | 改不同文件（safety_guard.py vs deploy_node.py），conflict_scope 无交集。都依赖 L2-01(deploy_001)/L2-02(deploy_007)。deploy_014 额外依赖 deploy_010（同文件订阅侧先完成）。 |
| 2 | deploy_015 | 单独 | 改 deploy_node.py（metrics 部分）+ shared_buffer.py，与 deploy_014 同 deploy_node.py，必须串行（014 先）。 |
| 3 | deploy_016 | 单独 | 单测 + shadow-run 验证，依赖前三者。 |

## 跨 L2 依赖说明

- `depends_on_external: [deploy_001, deploy_007, deploy_010]`：deploy_001（ACTION_DIM=16/BimanualAction）、deploy_007（SafetyConfig TCP/width）、deploy_010（deploy_node 订阅侧，deploy_014 的同文件前置）。

## 与 L2-03 的协调（关键）

deploy_014（本组）改 deploy_node.py 发布侧，deploy_010（L2-03）改 deploy_node.py 订阅侧。同一文件两半：
- **必须串行**（deploy_010 先归档，deploy_014 后做），或主 Agent 安排同一 Agent 顺序完成两半。
- deploy_014 的 `must_run_after: [deploy_010]` 明确标注。

## 全组完成标志

deploy_016 pytest 通过 = L2-04 action 处理与发布层完成 = 可开始 L2-05（硬件执行栈，真机风险最高）。

## 真机风险

deploy_016 为 dry-run-only/shadow-run 逻辑层（mock + stub，不接真机）。其余 L3 为 none。真机风险在 L2-05。

## shadow-run 语义说明

L2-04 完成后，Pi05 节点能在 shadow-run 下发布 `/pi05/policy_action`（16D），但 bridge（L2-05）未启动，所以：
- policy_action 有输出（Pi05 侧通了）
- 无下游消费（不动真机）
这正是 shadow-run 的语义。L2-05 完成后，bridge 接 policy_action，shadow-run 下 bridge gate 关闭仍不动真机；safe-run 才动真机。
