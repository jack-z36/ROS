lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  # Wider LoRA coverage: train attention projections across matched PI05 modules
  # plus the action expert head.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - out_proj
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out
    - linear

data:
  # Default public-repo location. Point this at your local LeRobot dataset if needed.
  dataset_path: /home/hit/pi05_ws/datasets/right_hand_pour_water_cup
  fps: 60
  num_workers: 4
  chunk_size: 30
  use_color_jitter: true
  image_size: 224
  # 末端位姿为 6D [x, y, z, roll, pitch, yaw]，因此 state_dim=14+2*6=26。
  state_dim: 26
  action_dim: 14
  cameras:
    - top
    - left_wrist
    - right_wrist
  features:
    observation.images.top:
      dtype: image
      shape: [224, 224, 3]
    observation.images.left_wrist:
      dtype: image
      shape: [224, 224, 3]
    observation.images.right_wrist:
      dtype: image
      shape: [224, 224, 3]
    observation.state:
      dtype: float32
      shape: [26]
    action:
      dtype: float32
      shape: [14]

model:
  chunk_size: 30
  n_action_steps: 30
  state_dim: 26
  action_dim: 14
  # 强制 PI0.5 内部 action_in_proj/action_out_proj 也使用 14D，而不是预训练默认 32D padding。
  max_action_dim: 14
  pretrained_path: lerobot/pi05_base
  train_expert_only: false

training:
  batch_size: 2
  lr: 1.0e-4
  epochs: 6
  max_steps_per_epoch: null
  gradient_accumulation_steps: 8
  warmup_steps: 500
  checkpoint_freq_epochs: 1
  # Recommended fast-start budget: stays in the official 3k-6k step regime and
  # is realistic to finish within roughly <=2 days on a single modern GPU.
  seed: 42
  grad_clip_norm: 1.0
  resume_from_checkpoint:
  mixed_precision: bf16

logging:
  project_name: pi05
  run_name: pi05_right_hand_pour_water_cup_wide_lora_v1
  output_dir: ../../outputs/checkpoints
  export_dir: ../../outputs/exports
  use_tensorboard: true
  tensorboard_dir: ../../outputs/logs/tensorboard
  tensorboard_auto_launch: true
  tensorboard_host: localhost
  tensorboard_port: 6006
  # Match official LeRobot behavior: average metrics over a fixed window before logging.
  log_freq: 200
