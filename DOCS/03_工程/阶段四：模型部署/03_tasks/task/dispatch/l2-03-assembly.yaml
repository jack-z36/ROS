## 调度说明

| wave | 任务 | 并行性 | 说明 |
|---|---|---|---|
| 1 | deploy_009 ∥ deploy_011 | 可并行 | 改不同文件（collector.py vs policy_loader.py），conflict_scope 无交集。 |
| 2 | deploy_010 | 单独 | 改 deploy_node 订阅侧，依赖 deploy_009。 |
| 3 | deploy_012 | 单独 | dry-run 验证，依赖前三者。 |

## 跨 L2 依赖说明

本功能组依赖 L2-01（deploy_002 state_codec）和 L2-02（deploy_005 observation topic）。`depends_on_external` 标注外部依赖。

## 与 L2-04 的协调

deploy_010（本组）改 deploy_node.py 订阅侧，L2-04 改 deploy_node.py 发布侧。同一文件两半，必须串行或由同一 Agent 顺序完成。

## 全组完成标志

deploy_012 dry-run 验证通过，且 `05_acceptance/l2-03-assembly/验收结果.md` 中 S1/S2/S3/S4 均通过 = L2-03 数据装配层完成 = 可开始 L2-04。

## 真机风险

deploy_012 为 dry-run-only（用构造数据 + stub，不接真机/真模型）。其余 L3 为 none。真机风险在 L2-05。

## L2 Gate

- L2 分支：`model_deploy-l2-03-assembly`
- 集成分支：`model_deploy`
- 验收结果：`DOCS/03_工程/阶段四：模型部署/05_acceptance/l2-03-assembly/验收结果.md`
- required L3：deploy_009、deploy_010、deploy_011、deploy_012
- 最低验证层级：dry-run
- 通过条件：required L3 全部完成、Assembly 运行验收 S1/S2/S3/S4 通过、不触发真机动作、验收结果文档记录运行命令、测试输入、观察点、通过现象和实际结果。
- Gate 通过后：允许按阶段四 Git 规则提交并推送 `model_deploy-l2-03-assembly`，再 `--no-ff` 合入 `model_deploy`。
