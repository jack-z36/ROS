pressure_driver_node:
  ros__parameters:
    frame_id_prefix: pressure_sensor
    default_baudrate: 460800
    default_poll_rate_hz: 100.0
    serial_timeout: 0.02
    timeout_warn_sec: 1.0
    identity_map_file: /home/hit/ROS/diagnostics/generated/pressure_only/hardware_identity_map_pressure_only_l1.yaml
    strict_identity: true
    identity_query_timeout: 3.0
    identity_query_package_id: 29
    sensor_defaults:
      device_addr: 6
      rows: 6
      cols: 15
    serial_port_globs: []
    data_response_timeout: 0.05
    inter_request_gap_sec: 0.0
    serial_ports:
    - name: left_gripper_1_port
      port: /dev/ttyUSB1
      baudrate: 460800
      sensors:
      - device_addr: 6
        rows: 6
        cols: 15
        hand: left_hand
        gripper: gripper_1
        topic: /pressure/left_hand/gripper_1
