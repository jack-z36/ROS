## 调度说明

| wave | 任务 | 并行性 | 说明 |
|---|---|---|---|
| 1 | deploy_013 ∥ deploy_014 | 可并行 | 改不同文件。deploy_014 额外依赖 deploy_010。 |
| 2 | deploy_015 | 单独 | 改 deploy_node.py metrics 部分，与 deploy_014 串行。 |
| 3 | deploy_016 | 单独 | 单测 + shadow-run 验证，依赖前三者。 |

## 跨 L2 依赖说明

`depends_on_external: [deploy_001, deploy_007, deploy_010]`：deploy_001 提供 16D action，deploy_007 提供 SafetyConfig，deploy_010 提供 deploy_node 订阅侧。

## shadow-run 语义说明

L2-04 完成后，Pi05 节点能在 shadow-run 下发布 `/pi05/policy_action`（16D），但 bridge（L2-05）未启动，所以 policy_action 有输出、无下游消费、不动真机。

## 全组完成标志

deploy_016 dry-run / shadow-run 验证通过，且 `05_acceptance/l2-04-publish/验收结果.md` 中 S1/S2/S3/S4 均通过 = L2-04 action 处理与发布层完成 = 可开始 L2-05。

## 真机风险

deploy_016 为 dry-run-only/shadow-run 逻辑层（mock + stub，不接真机）。其余 L3 为 none。真机风险在 L2-05。

## L2 Gate

- L2 分支：`model_deploy-l2-04-publish`
- 集成分支：`model_deploy`
- 验收结果：`DOCS/03_工程/阶段四：模型部署/05_acceptance/l2-04-publish/验收结果.md`
- required L3：deploy_013、deploy_014、deploy_015、deploy_016
- 最低验证层级：dry-run + shadow-run
- 通过条件：required L3 全部完成、Publish 运行验收 S1/S2/S3/S4 通过、`sent_to_driver=false`、验收结果文档记录运行命令、测试输入、观察点、通过现象和实际结果。
- Gate 通过后：允许按阶段四 Git 规则提交并推送 `model_deploy-l2-04-publish`，再 `--no-ff` 合入 `model_deploy`。
