## 调度说明

| wave | 任务 | 并行性 | 说明 |
|---|---|---|---|
| 1 | deploy_001 | 单独 | action_spec 是地基（定义 ACTION_DIM/STATE_DIM/TCP_POSE_DOF/GRIPPER_WIDTH_DOF 常量），必须最先。 |
| 2 | deploy_002 ∥ deploy_003 | 可并行 | state_codec 和 action_codec 改不同文件，都只依赖 deploy_001，conflict_scope 无交集，可并行。 |
| 3 | deploy_004 | 单独 | 单测依赖前三个全部完成。 |

## 冲突检查

- deploy_002（state_codec.py）与 deploy_003（action_codec.py）：**文件无交集**，可并行。
- deploy_001（action_spec.py）与 deploy_002/003：**有依赖**（后者引用前者常量），不可并行，必须 wave1 先完成。

## 全组完成标志

deploy_004 pytest 通过，且 `05_acceptance/l2-01-types/验收结果.md` 中 S1/S2/S3 均通过 = L2-01 Types 层重构完成 = 可开始 L2-02（Config 层）。

## 真机风险

全组 robot_risk = none。Types 层纯数据结构，不触发真机。真机风险在 L2-05（硬件执行栈）。

