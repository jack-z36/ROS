batch:
  input_dir: /home/hit/ROS/mcap
  output_dir: /home/hit/ROS/mcap_cleaned
  file_glob: "*.mcap"
  workers: 1
  overwrite: true
  fail_fast: true

transform:
  start_from_common:
    translation:
      x: 0.0
      y: 0.0
      z: 0.0
    rotation_xyzw:
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 1.0

pose_streams:
  - input_topic: /baton_mini_left/fast_odom
    msg_type: nav_msgs/msg/Odometry
    output_topic: /baton_mini_left/camera_common_pose
    transform_file: /home/hit/ROS/config/data_clean/data_clean_left_transform.yaml
  - input_topic: /baton_mini_right/fast_odom
    msg_type: nav_msgs/msg/Odometry
    output_topic: /baton_mini_right/camera_common_pose
    transform_file: /home/hit/ROS/config/data_clean/data_clean_right_transform.yaml

gripper_streams:
  - image_topic: /gopro_left/image_raw
    image_msg_type: sensor_msgs/msg/Image
    output_topic: /gopro_left/gripper_width
    output_msg_type: std_msgs/msg/Float32
    aruco_dict: DICT_4X4_50
    marker_id_0: 0
    marker_id_1: 1
    marker_min: 20.0
    marker_max: 300.0
    gripper_max: 100.0
  - image_topic: /gopro_right/image_raw
    image_msg_type: sensor_msgs/msg/Image
    output_topic: /gopro_right/gripper_width
    output_msg_type: std_msgs/msg/Float32
    aruco_dict: DICT_4X4_50
    marker_id_0: 0
    marker_id_1: 1
    marker_min: 20.0
    marker_max: 300.0
    gripper_max: 100.0

# frame_alignment: 场景一位姿转换配置契约
# common_anchor 定义 common_frame 锚点，默认 left（= left_umi_start_frame）
# common_from_right_start 必须由 T_right_start_common 求逆生成，不是固定底座直接给出
# camera_from_*_tcp 表示 T_camera_tcp，不得混用 tcp_from_camera
frame_alignment:
  common_anchor: left
  extrinsics:
    common_from_left_start:
      translation_m: [0.0, 0.0, 0.0]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    common_from_right_start:
      # 由 inverse(T_right_start_common) 生成，T_right_start_common 为右手位于 common_frame 标定位姿时的 raw pose
      translation_m: [0.0, 0.0, 0.0]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    camera_from_left_tcp:
      translation_m: [0.0, 0.0, 0.0]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    camera_from_right_tcp:
      translation_m: [0.0, 0.0, 0.0]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
