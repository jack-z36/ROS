bundle:
  # Real robot deployment reads only this exported bundle.
  bundle_dir: ../../outputs/exports/pi05_pour_water_v1

runtime:
  # dry-run: infer and log only; shadow-run: publish /pi05/policy_action;
  # safe-run: publish /pi05/policy_action for bridge consumption.
  mode: shadow-run
  device: cuda:0
  secondary_device:
  multi_gpu_strategy: none
  dtype: bfloat16
  inference_hz: 10
  control_hz: 30
  chunk_size: 30
  execute_horizon: 10
  prefetch_steps: 5
  blend_steps: 3
  max_action_age_sec: 0.45
  max_inference_requests: 1
  max_pending_chunks: 1
  fallback_policy: hold_last_action
  max_delta_per_step: 0.03
  # TO-BE: 16D action (left_tcp7 + left_gripper1 + right_tcp7 + right_gripper1)
  action_dim: 16
  # TO-BE: 16D state (left_tcp7 + left_gripper1 + right_tcp7 + right_gripper1)
  state_dim: 16
  warmup_steps: 2
  compile_model: true
  compile_mode: reduce-overhead
  publish_metrics_hz: 1
  task: pour water from the bottle into the cup

image:
  image_size: 224
  resize_mode: resize_pad
  # raw avoids JPEG/PNG decompression latency on the deployment machine.
  # Use compressed on bandwidth-limited links, or both while transitioning.
  transport: raw

topics:
  namespace: /pi05
  observation:
    # Fisheye cameras on each gripper (TO-BE).
    left_fisheye_image: /pi05/observation/image/left_gripper_fisheye
    right_fisheye_image: /pi05/observation/image/right_gripper_fisheye
    left_fisheye_image_raw: /pi05/observation/image/left_gripper_fisheye_raw
    right_fisheye_image_raw: /pi05/observation/image/right_gripper_fisheye_raw
    # RM65 TCP pose (TO-BE, replaces joint-space proprioception).
    left_tcp_pose: /pi05/observation/arm/left_tcp_pose
    right_tcp_pose: /pi05/observation/arm/right_tcp_pose
    # Elephant gripper state (TO-BE, width [0, 1] normalized).
    left_gripper_state: /pi05/observation/gripper/left_state
    right_gripper_state: /pi05/observation/gripper/right_state
    # Tactile reserved (optional, first version).
    # tactile_l1: /pi05/observation/tactile/l1
    # tactile_l2: /pi05/observation/tactile/l2
    # tactile_r1: /pi05/observation/tactile/r1
    # tactile_r2: /pi05/observation/tactile/r2
  command:
    # Single policy action topic (TO-BE, replaces four joint/hand targets).
    policy_action: /pi05/policy_action
    status: /pi05/status
    metrics: /pi05/metrics

safety:
  # TCP/width checks (TO-BE, replaces joint-space safety).
  max_tcp_delta_m: 0.05
  stale_observation_timeout_s: 0.5
  command_timeout_s: 0.45
  clamp_normalized_action: true
  hold_last_action: true
  gripper_width_min: 0.0
  gripper_width_max: 1.0
  joint_limits:
    enabled: false
    left_min_rad: []
    left_max_rad: []
    right_min_rad: []
    right_max_rad: []
