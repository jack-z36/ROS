# Hardware identity map for scenario 5.
#
# Fill the match fields after running:
#   python3 /home/hit/ROS/scripts/hardware_identity_scan.py scan
#
# Prefer serial-like fields such as ID_SERIAL, ID_SERIAL_SHORT, or protocol
# identities such as HWK_CHIP_UID. Use ID_PATH or DEVLINKS only as a temporary
# USB-topology fallback, and document the risk in
# /home/hit/ROS/DOCS/场景五/执行记录.md.

pressure:
  l1:
    device_type: serial
    required: true
    match: 
      ID_VENDOR_ID: "1a86"
      ID_MODEL_ID: "7523"
      HWK_CHIP_UID: "59573235-FF125043-FFFF54A0"
      HWK_DEVICE_ADDR: "1"
      HWK_PACKAGE_ID: "29"
    target:
      port_config_name: left_gripper_1_port
      topic: /pressure/left_hand/gripper_1
      hand: left_hand
      gripper: gripper_1
      stable_name: /dev/hwk_pressure_left_gripper_1

  l2:
    device_type: serial
    required: true
    match: 
      ID_VENDOR_ID: "1a86"
      ID_MODEL_ID: "7523"
      HWK_CHIP_UID: "59573235-FF125043-FFFF5392"
      HWK_DEVICE_ADDR: "1"
      HWK_PACKAGE_ID: "29"
    target:
      port_config_name: left_gripper_2_port
      topic: /pressure/left_hand/gripper_2
      hand: left_hand
      gripper: gripper_2
      stable_name: /dev/hwk_pressure_left_gripper_2

  r1:
    device_type: serial
    required: true
    match:
      ID_VENDOR_ID: "1a86"
      ID_MODEL_ID: "7523"
      HWK_CHIP_UID: "59573235-FF125043-FFFF5503"
      HWK_DEVICE_ADDR: "0"
      HWK_PACKAGE_ID: "29"
    target:
      port_config_name: right_gripper_1_port
      topic: /pressure/right_hand/gripper_1
      hand: right_hand
      gripper: gripper_1
      stable_name: /dev/hwk_pressure_right_gripper_1

  r2:
    device_type: serial
    required: true
    match: 
      ID_VENDOR_ID: "1a86"
      ID_MODEL_ID: "7523"
      HWK_CHIP_UID: "59573235-FF125043-FFFF559B"
      HWK_DEVICE_ADDR: "0"
      HWK_PACKAGE_ID: "29"
    target:
      port_config_name: right_gripper_2_port
      topic: /pressure/right_hand/gripper_2
      hand: right_hand
      gripper: gripper_2
      stable_name: /dev/hwk_pressure_right_gripper_2

gopro:
  right:
    device_type: video
    required: true
    require_video_capture: true
    match:
      ID_VENDOR_ID: "0bda"
      ID_MODEL_ID: "5858"
      ID_PATH: "pci-0000:00:14.0-usb-0:1:1.0"
      ID_V4L_CAPABILITIES: ":capture:"
    target:
      video_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:1:1.0-video-index0
      topic: /gopro_right/image_raw
      side: right

  left:
    device_type: video
    required: true
    require_video_capture: true
    match:
      ID_VENDOR_ID: "0bda"
      ID_MODEL_ID: "5858"
      ID_PATH: "pci-0000:00:14.0-usb-0:5:1.0"
      ID_V4L_CAPABILITIES: ":capture:"
    target:
      video_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:5:1.0-video-index0
      topic: /gopro_left/image_raw
      side: left
