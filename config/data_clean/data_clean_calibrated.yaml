# frame_alignment: 场景一位姿转换配置契约
# common_from_right_start 由 inverse(T_right_start_common) 生成
# camera_from_*_tcp 表示 T_camera_tcp
frame_alignment:
  common_anchor: left
  extrinsics:
    common_from_left_start:
      translation_m: [0.0, 0.0, 0.0]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    common_from_right_start:
      translation_m: [0.0, 0.0, 0.0]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    camera_from_left_tcp:
      translation_m: [0.0, 0.0, 0.0]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    camera_from_right_tcp:
      translation_m: [0.0, 0.0, 0.0]
      rotation_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
  pose_streams:
    left:
      input_topic: /baton_mini_left/fast_odom
      output_camera_pose_common: /baton_mini_left/camera_common_pose
      output_tcp_pose_common: /baton_mini_left/tcp_common_pose
    right:
      input_topic: /baton_mini_right/fast_odom
      output_camera_pose_common: /baton_mini_right/camera_common_pose
      output_tcp_pose_common: /baton_mini_right/tcp_common_pose
