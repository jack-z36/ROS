## 调度说明

| wave | 任务 | 并行性 | 真机风险 | 说明 |
|---|---|---|---|---|
| 1 | deploy_017 ∥ deploy_020 ∥ deploy_021 | 可并行 | 017=none，020/021=hardware-blocked | bridge 骨架 + 两个硬件适配节点，新建不同文件无冲突。 |
| 2 | deploy_018 ∥ deploy_019 | 可并行但建议同 Agent | hardware-blocked | bridge 接入 IK + gate/映射，同改 command_bridge_sender_node.py。 |
| 3 | deploy_022 | 单独 | hardware-blocked | 新 launch + shadow-run 全链路。 |
| 4 | deploy_023 | 单独 | real-robot | real-robot smoke test，默认 blocked。 |

## deploy_023 的 blocked 解除条件

必须全部满足：deploy_022 shadow-run 全链路通过、width 与 gripper 标定完成、真模型 bundle 就绪、物理急停和 deadman 可用、人在场、主 Agent/用户授权。

## 全组完成标志

deploy_022 shadow-run 通过并且 deploy_023 的 blocked / real-robot 记录完整 = L2-05 可进行 Gate 判断。只有 deploy_023 smoke test 真实执行并通过，才能声明阶段四真机 smoke test 通过。

## 回滚路径

- bridge/驱动节点不启动，policy_action 仍可独立 dry-run。
- 切回旧 launch、旧 config、旧 bundle。
- 运动中以物理急停优先。

## L2 Gate

- L2 分支：`model_deploy-l2-05-hardware`
- 集成分支：`model_deploy`
- 验收结果：`DOCS/03_工程/阶段四：模型部署/05_acceptance/l2-05-hardware/验收结果.md`
- required L3：deploy_017、deploy_018、deploy_019、deploy_020、deploy_021、deploy_022、deploy_023
- 最低验证层级：shadow-run + gated real-robot
- 通过条件：deploy_017 至 deploy_022 完成并通过 S1/S2/S3/S4；deploy_023 只有在安全条件满足后才允许解除 blocked；验收结果文档记录运行命令、测试输入、观察点、通过现象、实际结果和真机风险控制结论。
- Gate 通过后：允许按阶段四 Git 规则提交并推送 `model_deploy-l2-05-hardware`，再 `--no-ff` 合入 `model_deploy`。
