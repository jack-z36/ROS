## 调度说明

| wave | 任务 | 并行性 | 说明 |
|---|---|---|---|
| 1 | deploy_005 | 单独 | observation 字段重构（schema.py + topics.py）。 |
| 2 | deploy_006 | 单独 | command + 删 Bridge/Mux（同改 schema.py + topics.py）。 |
| 3 | deploy_007 | 单独 | RuntimeConfig 维度 + SafetyConfig（同改 schema.py）。 |
| 4 | deploy_008 | 单独 | deploy.yaml + 单测（验收前三者）。 |

## 为什么串行

deploy_005/006/007 都修改 `schema.py`（和 topics.py），`conflict_scope.files` 有交集，必须串行。deploy_008 依赖前三者完成后再写配置和测试。

## 全组完成标志

deploy_008 pytest 通过，且 `05_acceptance/l2-02-config/验收结果.md` 中 S1/S2/S3 均通过 = L2-02 Config 层重构完成 = 可开始 L2-03（数据装配 Service 层）。

## 真机风险

全组 robot_risk = none。Config 层不触发真机。真机风险在 L2-05。

