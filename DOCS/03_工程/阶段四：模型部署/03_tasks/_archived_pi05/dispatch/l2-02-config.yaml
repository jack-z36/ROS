## 调度说明

| wave | 任务 | 并行性 | 说明 |
|---|---|---|---|
| 1 | deploy_005 | 单独 | observation 字段重构（schema.py + topics.py）。 |
| 2 | deploy_006 | 单独 | command + 删 Bridge/Mux（同改 schema.py + topics.py）。 |
| 3 | deploy_007 | 单独 | RuntimeConfig 维度 + SafetyConfig（同改 schema.py）。 |
| 4 | deploy_008 | 单独 | deploy.yaml + 单测（验收前三者）。 |

## 为什么串行（max_parallel_agents: 1）

**关键决策**：deploy_005/006/007 都修改 `schema.py`（和 topics.py），`conflict_scope.files` 有交集。按调度元数据规则第 4 条「conflict_scope.files 有交集，不得并行分发」，必须串行。

虽然三者改 schema.py 的不同部分（observation / command+bridge+mux / runtime+safety），理论上可以并行，但单文件并行改容易产生合并冲突和中间状态不一致。串行更安全。

## 冲突检查

- deploy_005/006/007：schema.py 有交集 → 串行。
- deploy_008：改 deploy.yaml + 新建测试文件，与前三者文件无交集，但 depends_on 三者（需 schema 定型才能写配置和测试）。

## 全组完成标志

deploy_008 pytest 通过 = L2-02 Config 层重构完成 = 可开始 L2-03（数据装配 Service 层）。

