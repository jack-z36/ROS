## 调度说明

### Wave 结构与依赖

```text
wave1 (types 层, 3 个 L3 并行, 无依赖):
  deploy_001  contract_result.py    ─┐
  deploy_002  state_spec.py          ├─ 可并行 (不同文件)
  deploy_003  action_spec.py        ─┘

wave2 (repo 层, 4 个 L3 并行, 依赖 types):
  deploy_004  manifest_parser.py     ─┐
  deploy_005  normalizer_loader.py    ├─ 可并行 (不同文件)
  deploy_006  experiment_config_loader.py
  deploy_007  bundle_reader.py       ─┘

wave3 (config 核心, 依赖 types):
  deploy_008  schema.py 核心 + deploy.yaml

wave4 (config 契约校验, 依赖全部 types+repo+config核心, 同文件串行):
  deploy_009  schema.py 追加契约校验 + load_deploy_config

wave5 (集成测试, 依赖全部):
  deploy_010  tests/integration/test_l2_01_gate.py
```

### 冲突说明

- `deploy_008` 和 `deploy_009` 都写 `src/model_deploy/act/config/schema.py`，`conflict_scope.files` 重叠。`deploy_009` 的 `must_run_after: [deploy_008]` 强制串行，不得并行。
- 其余 L3 的 `conflict_scope.files` 互不重叠，同 wave 内可并行。
- `max_parallel_agents: 3`：wave2 有 4 个可并行 L3，主 Agent 每次最多派发 3 个，第 4 个等下一批。

### L2 Gate 场景覆盖矩阵

| 场景 | 描述 | 主要覆盖 L3 | 辅助覆盖 L3 |
|---|---|---|---|
| S1 | 合法配置载入 | deploy_008, deploy_009, deploy_010 | deploy_001, deploy_002, deploy_003 |
| S2 | 非法维度失败 | deploy_002, deploy_003, deploy_008, deploy_010 | — |
| S3 | bundle 缺文件失败 | deploy_004, deploy_007, deploy_009, deploy_010 | — |
| S4 | normalizer 维度不一致失败 | deploy_005, deploy_006, deploy_009, deploy_010 | — |
| S5 | 无平滑配置泄漏 | deploy_008, deploy_010 | — |

### 归档规则

当某个 L3 验收卡片返回 `PASS_LOCAL` 后，主 Agent 必须把对应任务文件从 `03_tasks/task/active/l2-01-external-contract/` 移动到 `03_tasks/completed/l2-01-external-contract/`。验收 Agent 不得执行归档。
